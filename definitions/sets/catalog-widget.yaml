name: catalog-widget
label: Catalog Widgets
description: CMS "Catalog Products List/Link" widgets for pages, blocks and Page Builder content. Dropped by mage-os/product-minimal-edition.
removable: false  # CMS / Page Builder content may reference the widgets at runtime in stock Mage-OS
# Up to modulargento 4.0.0, Magento_ConfigurableProduct declared a plugin on
# Magento\CatalogWidget\Block\Product\ProductsList, so di:compile failed
# without this set. 4.0.1 moved the plugin into the bridge module below.
removable_modulargento_since: 4.0.1
packages:
  - mage-os/module-catalog-widget
  # Bridge between ConfigurableProduct and CatalogWidget. Only modulargento
  # 4.0.1+ ships it; on other builds the replace entry is a no-op.
  - mage-os/module-configurable-product-catalog-widget
group: Marketing & Content
