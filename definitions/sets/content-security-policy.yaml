name: content-security-policy
label: Content Security Policy
description: CSP header management (Magento_Csp). Report-only by default; other modules contribute csp_whitelist.xml.
removable: false  # core modules ship csp_whitelist.xml consumed by Magento_Csp in stock Mage-OS
# Up to modulargento 4.0.0, Theme and Checkout required Magento_Csp classes
# (di:compile failed without it). 4.0.1 moved that code behind Csp.
removable_modulargento_since: 4.0.1
packages:
  - mage-os/module-csp
group: Security
